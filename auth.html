<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ApexDesk — Account Portal</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #0F172A;
      --accent: #2563EB;
      --accent-hover: #1D4ED8;
      --bg-light: #F8FAFC;
      --text-dark: #0F172A;
      --text-muted: #64748B;
      --border: #E2E8F0;
      --white: #FFFFFF;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-light); color: var(--text-dark); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }

    .auth-card { background: var(--white); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 420px; padding: 2.5rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
    .logo { font-size: 1.5rem; font-weight: 800; color: var(--primary); text-decoration: none; display: block; text-align: center; margin-bottom: 1.5rem; }
    .logo span { color: var(--accent); }

    h2 { font-size: 1.5rem; font-weight: 700; text-align: center; margin-bottom: 1.5rem; color: var(--primary); }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; margin-bottom: 0.4rem; font-weight: 500; font-size: 0.9rem; }
    .form-group input { width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; }
    .form-group input:focus { outline: none; border-color: var(--accent); }

    .btn { width: 100%; background-color: var(--accent); color: var(--white); padding: 0.75rem; border-radius: 6px; font-weight: 600; border: none; cursor: pointer; font-size: 1rem; transition: background 0.2s; }
    .btn:hover { background-color: var(--accent-hover); }

    .toggle-link { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted); }
    .toggle-link a { color: var(--accent); text-decoration: none; font-weight: 600; cursor: pointer; }
    .back-home { text-align: center; margin-top: 1rem; display: block; color: var(--text-muted); text-decoration: none; font-size: 0.85rem; }
    .back-home:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="auth-card">
    <a href="/index.html" class="logo">Apex<span>Desk</span></a>
    <h2 id="auth-title">Account Login</h2>

    <form id="auth-form" onsubmit="handleAuth(event)">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="auth-email" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="auth-password" required placeholder="••••••••">
      </div>
      
      <div class="form-group reg-field" style="display:none;">
        <label>Full Name</label>
        <input type="text" id="auth-name" placeholder="John Doe">
      </div>
      <div class="form-group reg-field" style="display:none;">
        <label>GCash Phone Number</label>
        <input type="text" id="auth-gcash" placeholder="09171234567">
      </div>

      <button type="submit" class="btn" id="auth-btn">Login</button>
    </form>

    <div class="toggle-link">
      <span id="toggle-text">Need an account?</span>
      <a onclick="toggleAuthMode()" id="auth-toggle-link">Register here.</a>
    </div>

    <a href="/index.html" class="back-home">← Back to Main Store</a>
  </div>

  <script>
    const SUPABASE_URL = 'https://kttjrrpiionugwnkexuv.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Nadrf5z4Cjm3S6tSwibs3w_6rMgKBEY';

    let supabase = null;
    let currentAuthMode = 'login';

    if (typeof window.supabase !== 'undefined') {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    function toggleAuthMode() {
      currentAuthMode = currentAuthMode === 'login' ? 'register' : 'login';
      
      document.getElementById('auth-title').innerText = currentAuthMode === 'login' ? 'Account Login' : 'Register Account';
      document.getElementById('auth-btn').innerText = currentAuthMode === 'login' ? 'Login' : 'Register Account';
      
      const isReg = currentAuthMode === 'register';
      document.querySelectorAll('.reg-field').forEach(el => el.style.display = isReg ? 'block' : 'none');
      
      document.getElementById('auth-name').required = isReg;
      document.getElementById('auth-gcash').required = isReg;

      document.getElementById('toggle-text').innerText = isReg ? 'Already have an account?' : 'Need an account?';
      document.getElementById('auth-toggle-link').innerText = isReg ? 'Login here.' : 'Register here.';
    }

    async function handleAuth(e) {
      e.preventDefault();

      if (!supabase) {
        alert('Authentication service failed to load. Please disable ad blockers and refresh.');
        return;
      }

      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;

      try {
        if (currentAuthMode === 'login') {
          const { error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) alert(error.message);
          else window.location.href = '/index.html';
        } else {
          const fullName = document.getElementById('auth-name').value;
          const gcash = document.getElementById('auth-gcash').value;
          
          const { data, error } = await supabase.auth.signUp({ email, password });
          if (error) return alert(error.message);

          if (data.user) {
            await supabase.from('profiles').insert([{ id: data.user.id, full_name: fullName, gcash_number: gcash }]);
            alert('Registration successful!');
            window.location.href = '/index.html';
          }
        }
      } catch (err) {
        alert('Authentication error: ' + err.message);
      }
    }
  </script>
</body>
</html>
